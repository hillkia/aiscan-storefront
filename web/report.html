<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Opportunity Scan — Report</title>
<style>
  :root{--ink:#1a1207;--mut:#7a6a55;--line:#e7ddcf;--accent:#e8590c;--accent2:#ff8c2b;--bg:#fbf7f1}
  *{box-sizing:border-box;margin:0}
  body{background:#efe7db;color:var(--ink);font-family:-apple-system,"Segoe UI",Inter,Georgia,serif;line-height:1.5}
  .page{max-width:820px;margin:24px auto;background:var(--bg);border:1px solid var(--line);
    border-radius:14px;padding:44px 48px 40px;box-shadow:0 12px 40px rgba(0,0,0,.15)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--accent);padding-bottom:14px}
  .brand{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);font-weight:700}
  .dl{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer}
  h1{font-size:26px;margin:18px 0 6px;letter-spacing:-.3px}
  .thesis{color:var(--mut);font-size:15px;font-style:italic;border-left:3px solid var(--accent2);padding-left:14px;margin:14px 0 26px}
  .op{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;page-break-inside:avoid}
  .op .h{display:flex;align-items:center;gap:12px}
  .op .rank{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 26px}
  .op .nm{font-size:17px;font-weight:700;flex:1}
  .op .sc{font-size:20px;font-weight:800;color:var(--accent)}
  .op .tr{font-size:11px;padding:2px 8px;border-radius:20px;background:#eee;color:#555}
  .op .tr.up{background:#e6f6ea;color:#1a7f37}.op .tr.down{background:#fdeaea;color:#b42318}
  .bar{height:7px;background:#efe6d8;border-radius:5px;overflow:hidden;margin:10px 0}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .lbl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-top:8px}
  .txt{font-size:14px;margin-top:2px}
  .foot{margin-top:26px;border-top:1px solid var(--line);padding-top:14px;color:var(--mut);font-size:11px;line-height:1.6}
  @media print{ body{background:#fff} .page{box-shadow:none;border:none;margin:0;max-width:none;border-radius:0} .dl{display:none} }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="top">
    <div class="brand">🛰️ AI Opportunity Scan</div>
    <button class="dl" onclick="window.print()">⬇ Download PDF</button>
  </div>
  <h1 id="topic">Loading…</h1>
  <div class="thesis" id="thesis"></div>
  <div id="ops"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const id=(location.pathname.split('/').pop()||'').trim();
const TR={up:'▲ rising',flat:'→ steady',down:'▼ cooling',naik:'▲ rising',stabil:'→ steady',turun:'▼ cooling'};
function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(d){
  if(!d || d.error){
    document.getElementById('topic').textContent='Report not found';
    document.getElementById('thesis').textContent=
      'This report has expired on the server. Re-run the scan with your license key — it is unlimited.';
    return;
  }
  document.title='AI Opportunity Scan — '+(d.topic||'');
  document.getElementById('topic').textContent=d.topic||'Opportunity Scan';
  document.getElementById('thesis').textContent=d.summary||'';
  const sorted=(d.sectors||[]).slice().sort((a,b)=>(b.score||0)-(a.score||0));
  document.getElementById('ops').innerHTML=sorted.map((s,i)=>{
    const tr=(s.trend||'flat').toLowerCase(), cls=(tr==='up'||tr==='naik')?'up':((tr==='down'||tr==='turun')?'down':'');
    return `<div class="op"><div class="h"><div class="rank">${i+1}</div>
      <div class="nm">${esc(s.name)}</div><span class="tr ${cls}">${TR[tr]||tr}</span><div class="sc">${s.score||0}</div></div>
      <div class="bar"><i style="width:${Math.max(4,Math.min(100,s.score||0))}%"></i></div>
      <div class="lbl">Why now</div><div class="txt">${esc(s.insight)}</div>
      <div class="lbl">Entry play</div><div class="txt">${esc(s.peluang)}</div></div>`;
  }).join('');
  const dt=new Date((d.at||Date.now()/1000)*1000).toISOString().slice(0,10);
  document.getElementById('foot').innerHTML='Generated '+dt+' · AI-reasoned strategic guidance from live signals — sharp and actionable, not licensed research data. Decisions remain yours. · Powered by Shamar';
}

// Salinan di browser dulu (tahan restart server), baru tanya server.
let cached=null;
try{ cached=JSON.parse(sessionStorage.getItem('scan:'+id)||'null'); }catch(_){}
if(cached) render(cached);
else fetch('/api/report/'+id).then(r=>r.json()).then(render).catch(()=>render(null));
</script>
</body>
</html>
